name: Deploy to JCloud

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 프론트엔드 빌드 (GitHub Secrets 환경변수 주입)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build

      - name: JCloud 서버로 파일 전송 및 백엔드 재시작
        env:
          SSH_KEY: ${{ secrets.JCLOUD_SSH_KEY }}
          HOST: ${{ secrets.JCLOUD_HOST }}
          PORT: ${{ secrets.JCLOUD_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

          # 기존 dist 정리 후 새 파일 전송 (dist, server.js, package.json)
          ssh -p "$PORT" ubuntu@"$HOST" "mkdir -p /var/www/mureview-web/dist && rm -rf /var/www/mureview-web/dist/*"
          scp -P "$PORT" -r ./dist/* ubuntu@"$HOST":/var/www/mureview-web/dist/
          scp -P "$PORT" ./server.js ./package.json ubuntu@"$HOST":/var/www/mureview-web/

          # 백엔드(server.js) PM2 실행 또는 재시작
          ssh -p "$PORT" ubuntu@"$HOST" << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /var/www/mureview-web
            pm2 delete mureview-api 2>/dev/null || true
            pm2 restart mureview-web || pm2 start server.js --name mureview-web
            pm2 save
          EOF